   crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
   integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
   crossorigin=""></script>

<!--Set map position and style-->
<style>
		#map {
			position: relative;
			top: 0;
			bottom: 0;
			left: 0;
			right: 0;
			width: 80%;
			height: 600px;
		}
	</style>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--Set map title-->
	<title>DNP Project Directory</title>
</head>
<body>
	<script src='https://msmith0913.github.io/dnp-test/layers/L.Control.Layers.Tree.js'></script>
	<script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.2.0/leaflet-omnivore.min.js'></script>
<!--Set map title--> 
    <h1>DNP Project Directory</h1>

<!--Center and Zoom-->
<div style="margin: auto" id = "map"></div>
	<script>
		var map = L.map('map', {
			center: [38.62718883493524, -90.17973025660817],
			zoom: 9
		});

// Add basemap	
		L.tileLayer('https://api.maptiler.com/maps/topo/{z}/{x}/{y}.png?key=4CI3hvSGGwgJXODif6KH', {attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
		}).addTo(map);

const layersByAttribute = {};
// Load the csv using Papa parse and divide csv into layers by attribute
	Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRCWWzed2VBvqVAtg0PcXBEE-XCHypIAgrP167pekzUglTbVOXIMK4JnTo3S0nmv_mvh745bJycla/pub?output=csv', {
		download: true,
		header: true,
		dynamicTyping: true,
		complete: function(results) {
			results.data.forEach(row => {
				if (!row.latitude || !row.longitude || !row.phase) return;
				var phase = row.phase.trim();
				if (!layersByAttribute[phase]) {
					layersByAttribute[phase] = L.layerGroup();
				}
				const marker = L.marker([row.latitude, row.longitude]) //bind popup goes here
	
				layersByAttribute[phase].addLayer(marker);
			});
		
			const overlayMaps = {};
			for (const category in layersByAttribute) {
				layers[category].addTo(map);
				overlayMaps[category] = layersByAttribute[category];
			}

			L.control.layersByAttribute(null, overlayMaps, {collapsed: false}).addTo(map);
		},	
	});

	
	</script>

</script>
