<!--Set map position and style-->
<style>
		#map {
			position: relative;
			top: 0;
			bottom: 0;
			left: 0;
			right: 0;
			width: 80%;
			height: 600px;
		}
	</style>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--Set map title-->
	<title>DNP Project Directory</title>
</head>
<body>
	<script src='https://msmith0913.github.io/dnp-test/layers/L.Control.Layers.Tree.js'></script>
	<script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.2.0/leaflet-omnivore.min.js'></script>
<!--Set map title--> 
    <h1>DNP Project Directory</h1>

<!--Center and Zoom-->
<div style="margin: auto" id = "map"></div>
	<script>
		var map = L.map('map', {
			center: [38.62718883493524, -90.17973025660817],
			zoom: 9
		});

// Add basemap	
		L.tileLayer('https://api.maptiler.com/maps/topo/{z}/{x}/{y}.png?key=4CI3hvSGGwgJXODif6KH', {attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
		}).addTo(map);

var castleIcon = L.icon({
	iconUrl: 'https://submissionstrategies.com/media/castleicon.png',
	iconSize: [],
	popupAnchor: [-3, -76],
});
var churchIcon = L.icon({
	iconUrl: 'https://submissionstrategies.com/media/churchicon.png',
	iconSize: [17, 17],
	popupAnchor: [-3, -76],
});

// Layers		
const completedLayer = L.layerGroup();
  const activeLayer = L.layerGroup();
  const futureLayer = L.layerGroup();
 
  const overlayMaps = {
    "Completed": completedLayer,
    "Active": activeLayer,
    "Future": futureLayer
  };
 
  L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
 
  omnivore
    .csv('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRCWWzed2VBvqVAtg0PcXBEE-XCHypIAgrP167pekzUglTbVOXIMK4JnTo3S0nmv_mvh745bJycla/pub?output=csv')
    .on('ready', function () {
      this.eachLayer(function (marker) {
        const props = marker.toGeoJSON().properties;
        const phase = (props.phase || '').trim().toLowerCase();
 
        marker.bindPopup(
          "<b>Organization: </b>" + props.organization_name +
          "<br><b>Project Title:</b> " + props.project_title +
          "<br><b>Description: </b>" + props.focus +
          "<br><b>Site Type: </b>" + props.site_type +
          "<br><b>Location: </b>" + props.address +
          "<br><b>Population: </b>" + props.pop_focus +
          "<br><b>Project Status: </b>" + props.phase
        );
 
        if (phase === 'completed') {
          completedLayer.addLayer(castleIcon);
        } else if (phase === 'future') {
          futureLayer.addLayer(marker);
        } else if (phase === 'active') {
          activeLayer.addLayer(marker);
        }
      });
 
      completedLayer.addTo(map);
      futureLayer.addTo(map);
      activeLayer.addTo(map);
    });
</script>

</script>
