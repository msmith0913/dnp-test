    <h1>DNP Project Directory</h1>

<div style="margin: auto" id = "map"></div>
	<script>
		var map = L.map('map', {
			center: [38.62718883493524, -90.17973025660817],
			zoom: 9
		});

		L.tileLayer('https://api.maptiler.com/maps/topo/{z}/{x}/{y}.png?key=4CI3hvSGGwgJXODif6KH', {attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
		}).addTo(map);

		omnivore.csv('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRCWWzed2VBvqVAtg0PcXBEE-XCHypIAgrP167pekzUglTbVOXIMK4JnTo3S0nmv_mvh745bJycla/pub?output=csv')
		.on('ready', function(layer) {
			this.eachLayer(function(marker) {
				marker.bindPopup("<b>Organization: </b>" + marker.toGeoJSON().properties.organization_name + "<br><b>Location:</b> " + marker.toGeoJSON().properties.address + "<br><b>Site type: </b>" + marker.toGeoJSON().properties.site_type + "<br><b>Need: </b>" + marker.toGeoJSON().properties.focus + "<br><b>Remote work: </b>" + marker.toGeoJSON().properties.remote + "<br><b>Explanation of remote work: </b>" + marker.toGeoJSON().properties.remote_explanation);
		});
	})
	.addTo(map);

	</script>

</script>
