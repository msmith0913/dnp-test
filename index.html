<html>
<head>
	  <link rel="stylesheet" href="https://submissionstrategies.com/css/r2.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
   integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
   crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
   integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
   crossorigin=""></script>
	 <link rel="stylesheet" href="https://msmith0913.github.io/dnp-test/layers/L.Control.Layers.Tree.css"/>
	 <script src="https://cdnjs.cloudflare.com/ajax/libs/OverlappingMarkerSpiderfier-Leaflet/0.2.6/oms.min.js"></script>
	
<!--Set map position and style-->
<style>
		#map {
			position: relative;
			top: 0;
			bottom: 0;
			left: 0;
			right: 0;
			width: 80%;
			height: 600px;
		}
	</style>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--Set map title-->
	<title>DNP Project Directory</title>
</head>
<body>
	<script src='https://msmith0913.github.io/dnp-test/layers/L.Control.Layers.Tree.js'></script>
	<script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.2.0/leaflet-omnivore.min.js'></script>
<!--Set map title--> 
    <h1>DNP Project Directory</h1>

<!--Center and Zoom-->
<div style="margin: auto" id = "map"></div>
	<script>
		var map = L.map('map', {
			center: [38.62718883493524, -90.17973025660817],
			zoom: 9
		});

// Add basemap	
		L.tileLayer('https://api.maptiler.com/maps/topo/{z}/{x}/{y}.png?key=4CI3hvSGGwgJXODif6KH', {attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
		}).addTo(map);

// Add and set icons
		var castleIcon = L.icon({
			iconUrl: 'https://submissionstrategies.com/media/castleicon.png',
			iconSize: [],
			popupAnchor: [-3, -76],
		});
		
		var churchIcon = L.icon({
			iconUrl: 'https://submissionstrategies.com/media/churchicon.png',
			iconSize: [17, 17],
			popupAnchor: [-3, -76],
		});

		var remoteLayer = L.geoJson(null, {
		icon: churchIcon,
        filter: function(layer) {
            if (layer.properties.remote == "Yes")
                return true;
        }
    });
    var inPersonLayer = L.geoJson(null, {
        filter: function(layer) {
            if (layer.properties.remote == "No")
                return true;
        }
    });

	var completeLayer = L.geoJson(null, {
    	filter: function(layer) {
            if (layer.properties.phase == "Complete")
                return true;
        }
    });

	var ongoingLayer = L.geoJson(null, {
        filter: function(layer) {
            if (layer.properties.phase == "Ongoing")
                return true;
        }
    });

	var proposedLayer = L.geoJson(null, {
        filter: function(layer) {
            if (layer.properties.phase == "Proposed")
                return true;
        }
    });

// Import all layers		
	var remote = omnivore.csv('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRCWWzed2VBvqVAtg0PcXBEE-XCHypIAgrP167pekzUglTbVOXIMK4JnTo3S0nmv_mvh745bJycla/pub?output=csv', null, remoteLayer);
	var inPerson = omnivore.csv('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRCWWzed2VBvqVAtg0PcXBEE-XCHypIAgrP167pekzUglTbVOXIMK4JnTo3S0nmv_mvh745bJycla/pub?output=csv', null, inPersonLayer);
	var proposed = omnivore.csv('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRCWWzed2VBvqVAtg0PcXBEE-XCHypIAgrP167pekzUglTbVOXIMK4JnTo3S0nmv_mvh745bJycla/pub?output=csv', null, proposedLayer);
	var ongoing = omnivore.csv('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRCWWzed2VBvqVAtg0PcXBEE-XCHypIAgrP167pekzUglTbVOXIMK4JnTo3S0nmv_mvh745bJycla/pub?output=csv', null, ongoingLayer);
	var complete = omnivore.csv('https://docs.google.com/spreadsheets/d/e/2PACX-1vTPRCWWzed2VBvqVAtg0PcXBEE-XCHypIAgrP167pekzUglTbVOXIMK4JnTo3S0nmv_mvh745bJycla/pub?output=csv', null, completeLayer);
		var allLayers = L.layerGroup([remoteLayer, inPersonLayer]).addTo(map);

	var entityTree = {
	label: '<strong><i>Project Status</i></strong>',
	selectAllCheckbox: 'Un/select all',
	children: [
		{
				label: '<strong>Completed</strong>',
				selectAllCheckbox: true,
				layer: completed,
				},
		{
			label: '<strong>Ongoing</strong>',
			selectAllCheckbox: true,
			layer: ongoing,
		},
		{
			label: '<strong>Proposed</strong>',
			selectAllCheckbox: true,
			layer: proposed,
			}
	]
};

L.control.layers.tree(null, entityTree).addTo(map);
	
	</script>

</script>

	<iframe title="Area Nursing Projects" aria-label="Table" id="datawrapper-chart-f2KQr" src="https://datawrapper.dwcdn.net/f2KQr/1/" scrolling="no" frameborder="0" style="border: none;" width=100% height="565" data-external="1"></iframe>
